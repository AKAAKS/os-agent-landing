<!-- A page of the ledger: four records, one of them refused. The red is the
     same --warstory #812317 the page uses for a refusal, and nothing else. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#F4F2EC"/>
  <rect x="0.5" y="0.5" width="63" height="63" fill="none" stroke="#9E9684"/>
  <g stroke-width="5" stroke-linecap="butt">
    <line x1="12" y1="18" x2="48" y2="18" stroke="#1C1A17"/>
    <line x1="12" y1="30" x2="40" y2="30" stroke="#1C1A17"/>
    <line x1="12" y1="42" x2="52" y2="42" stroke="#812317"/>
    <line x1="12" y1="54" x2="34" y2="54" stroke="#1C1A17"/>
  </g>
</svg>
