<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="OS Agent: field guide to a Windows daemon with privileged authority over a machine. Includes its full audit ledger: 564 actions over 81 days, 37 attempts to kill a process, one allowed." />
    <!-- A manual is printed. There is no dark mode, declared here so the
         browser does not synthesise one. -->
    <meta name="color-scheme" content="light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OS Agent: Field Guide" />
    <meta property="og:description" content="A Windows daemon with real authority over a machine, documented as a manual, with its own audit ledger attached. 37 attempts to kill a process in 81 days. One was allowed." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The title page of the OS Agent field guide, printed on cream stock: the title, the issue date, and two facing columns headed 'What it may do' and 'What it may not'." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OS Agent: Field Guide" />
    <meta name="twitter:description" content="A Windows daemon with real authority over a machine, documented as a manual, with its own audit ledger attached." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two faces, because the document has two kinds of content: Source Serif
         for everything the manual says in its own voice, IBM Plex Mono for
         everything quoted from the machine. The typeface IS the boundary
         between authored and transcribed — do not set quoted text in serif. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>OS Agent: Field Guide</title>
  </head>
